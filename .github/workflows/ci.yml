name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: neuropus
          POSTGRES_PASSWORD: neuropus
          POSTGRES_DB: neuropus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuropus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neuropus:neuropus@localhost:5432/neuropus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
